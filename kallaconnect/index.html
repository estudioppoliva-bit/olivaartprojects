<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Silvia E. Oliva Sainz — Kalla Connect LLC</title>
<meta name="description" content="Silvia E. Oliva Sainz · Cofundadora, Soluciones para Clientes · Kalla Connect LLC. Consultoría en tecnología, automatización de procesos y gestión de datos.">
<meta name="theme-color" content="#142A3F">
<link rel="icon" href="/kallaconnect/logo-k.png">
<link rel="apple-touch-icon" href="/kallaconnect/logo-k.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#142A3F;
  --navy-alto:#1E3A54;
  --navy-hondo:#0D1C2B;
  --kalla:#3E6B8A;
  --kalla-claro:#5E8FB0;
  --rojo:#C82220;
  --crema:#F3EFE4;
  --crema-tenue:#9FB0C0;
  --hilo:rgba(243,239,228,0.16);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  min-height:100dvh;
  background:var(--navy);
  color:var(--crema);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-weight:400;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  position:relative;
  overflow-x:hidden;
  padding:
    calc(2.5rem + env(safe-area-inset-top)) 1.5rem
    calc(2.5rem + env(safe-area-inset-bottom));
}

/* Fondo con las líneas de flujo dibujadas */
body::before{
  content:"";
  position:fixed;inset:0;
  background:url("/kallaconnect/fondo.jpg") center top / cover no-repeat, var(--navy);
  z-index:0;
}
/* Velo para que el texto se lea sobre las líneas */
body::after{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(80% 42% at 50% 30%, rgba(20,42,63,0.78) 0%, rgba(20,42,63,0.42) 60%, rgba(20,42,63,0.18) 100%),
    linear-gradient(180deg, rgba(20,42,63,0.55) 0%, rgba(13,28,43,0.35) 50%, rgba(13,28,43,0.72) 100%);
  z-index:0;
  pointer-events:none;
}

.tarjeta{
  position:relative;
  z-index:1;
  width:100%;
  max-width:23.5rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

/* ---------- Cabecera de marca ---------- */
.cabecera{
  display:flex;
  align-items:center;
  gap:0.7rem;
}
.cabecera img{
  width:34px;height:34px;
  border-radius:8px;
  display:block;
}
.marca{
  font-family:"Fraunces",Georgia,serif;
  font-weight:400;
  font-size:1.375rem;
  letter-spacing:0.005em;
  line-height:1;
  margin:0;
  color:var(--crema);
}

/* ---------- Koi ---------- */
.koi{
  position:relative;
  z-index:2;
  width:min(16rem,72%);
  height:auto;
  display:block;
  margin:2rem 0 1.5rem;
  filter:drop-shadow(0 16px 30px rgba(8,18,30,0.5));
  opacity:0;
  animation:nadar 1s cubic-bezier(.22,.61,.36,1) .1s forwards;
}
@keyframes nadar{
  from{opacity:0;transform:translateY(12px) scale(.96);}
  to{opacity:1;transform:none;}
}

/* ---------- Persona ---------- */
.nombre{
  font-family:"Fraunces",Georgia,serif;
  font-weight:300;
  font-size:clamp(1.5rem,6.4vw,1.9375rem);
  line-height:1.22;
  letter-spacing:0.004em;
  margin:0;
}
.cargo{
  font-size:0.6875rem;
  font-weight:400;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--crema-tenue);
  margin:1rem 0 0;
  line-height:1.9;
}
.cargo .punto{color:var(--rojo);}

/* ---------- Acciones ---------- */
.acciones{
  width:100%;
  display:grid;
  gap:0.5rem;
  margin-top:2.25rem;
}
.boton{
  display:flex;
  align-items:center;
  gap:0.875rem;
  padding:0.9rem 1.0625rem;
  border:1px solid var(--hilo);
  border-radius:2px;
  color:var(--crema);
  text-decoration:none;
  font-size:0.8125rem;
  letter-spacing:0.03em;
  background:rgba(243,239,228,0.035);
  transition:background .2s ease, border-color .2s ease, transform .12s ease;
}
.boton:active{transform:scale(.985);}
.boton:hover,.boton:focus-visible{
  background:rgba(243,239,228,0.08);
  border-color:rgba(243,239,228,0.34);
}
.boton svg{flex:none;width:17px;height:17px;stroke:var(--kalla-claro);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.boton span{text-align:left;word-break:break-word;}

.boton.principal{
  background:var(--kalla);
  border-color:var(--kalla);
  justify-content:center;
  font-weight:500;
  letter-spacing:0.16em;
  text-transform:uppercase;
  font-size:0.75rem;
  padding:1.0625rem;
  margin-bottom:0.375rem;
}
.boton.principal svg{stroke:var(--crema);}
.boton.principal:hover,.boton.principal:focus-visible{
  background:var(--kalla-claro);
  border-color:var(--kalla-claro);
}

/* ---------- Pie ---------- */
.pie{
  margin-top:2.25rem;
  padding-top:1.5rem;
  border-top:1px solid var(--hilo);
  width:100%;
}
.lema{
  font-family:"Fraunces",Georgia,serif;
  font-weight:300;
  font-size:1rem;
  line-height:1.45;
  margin:0;
  color:var(--crema);
}
.servicios{
  font-size:0.625rem;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--crema-tenue);
  margin:0.9rem 0 0;
  line-height:1.9;
}

a:focus-visible{outline:2px solid var(--kalla-claro);outline-offset:3px;}

@media (prefers-reduced-motion:reduce){
  .koi{animation:none;opacity:1;}
  .boton{transition:none;}
}
</style>
</head>
<body>

    <p class="marca">Kalla Connect</p>

  <img class="koi" src="/kallaconnect/koi.png" alt="Kalla, el koi de Kalla Connect">

  <h1 class="nombre">Silvia E. Oliva Sainz</h1>
  <p class="cargo">Cofundadora<br><span class="punto">·</span> Soluciones para Clientes <span class="punto">·</span></p>

      <span>WhatsApp</span>

    <a class="boton" href="mailto:oliva@kallaconnect.com">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3.5 7.5 8.5 6 8.5-6"/></svg>

      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.5 9.5h17M3.5 14.5h17M12 3a14.5 14.5 0 0 1 0 18 14.5 14.5 0 0 1 0-18z"/></svg>

  </nav>

  <div class="pie">

    <p class="servicios">Tecnología · Automatización<br>Gestión de datos</p>
  </div>

</main>

</body>
</html>
